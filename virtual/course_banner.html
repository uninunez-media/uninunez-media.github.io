<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner UNINUÑEZ INGENIERÍA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap');

        :root {
            --color-primario: #249A8C;
            --fondo-franja: var(--color-primario);
            --color-blanco: #ffffff;
            --color-gris-fondo: #ffffff;
        }

        body {
            margin: 0;
            padding: 0; 
            font-family: 'Montserrat', sans-serif;
            background-color: var(--color-blanco); 
            display: block; 
            overflow-x: hidden;
        }

        .banner {
            width: 100%;
            max-width: 100%;
            background-color: var(--color-blanco);
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 350px;
            box-shadow: none; 
            overflow: hidden;
            border-radius: 0; 
            isolation: isolate;
        }

        .contenido-izq {
            flex: 1;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 20px;
            position: relative;
        }

        .titulo-top {
            color: var(--color-primario);
            font-size: 2rem;
            font-weight: 800;
            margin: 0;
            padding: 0 0 10px 50px;
            text-transform: uppercase;
            line-height: 1;
        }

        .franja-color {
            background: var(--fondo-franja);
            color: var(--color-blanco);
            padding: 50px 50px;
            width: 120%;
            position: relative;
            z-index: 1;
            margin-bottom: 20px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
        }

        .franja-color h2 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 400;
            line-height: 1.25;
            max-width: 40%;
            overflow-wrap: break-word;
        }

        .logos-area {
            padding: 0 0 0 30px;
            margin-top: 5px;
        }
        
        .logos-img {
            height: 35px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .bloque-imagen {
            width: 45%;
            height: 100%;
            position: absolute;
            right: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
        }

        .agrupador-imagen {
            position: relative;
            width: 340px;
            height: 300px;
            margin-right: 40px; 
        }

        .imagen-container {
            width: 100%;
            height: 100%;
            position: relative;
            pointer-events: auto;
            border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
            border: 12px solid white;
            overflow: hidden;
            box-shadow: -10px 10px 20px rgba(0,0,0,0.15);
            background: white;
            transition: all 0.5s ease;
            z-index: 5;
        }

        .imagen-banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.05);
        }

        .linea-organica {
            position: absolute;
            border: 2px solid var(--color-primario);
            background: transparent;
            z-index: 10;
            pointer-events: none;
            top: 50%;
            left: 50%;
        }

        .linea-1 {
            width: 350px;
            height: 310px;
            border-radius: 44% 56% 68% 32% / 47% 43% 53% 57%;
            transform: translate(-50%, -50%) rotate(-3deg);
            opacity: 0.8;
        }

        .linea-2 {
            width: 360px;
            height: 320px;
            border-radius: 40% 60% 72% 28% / 43% 47% 57% 53%;
            transform: translate(-50%, -50%) rotate(4deg);
            border-width: 1px;
            opacity: 0.6;
        }

        @media (max-width: 900px) {
            body {
                height: auto;
                min-height: auto;
                overflow-y: auto; 
            }

            .banner {
                flex-direction: column;
                height: auto;
                text-align: center;
                padding-bottom: 30px;
                padding-top: 20px;
            }

            .contenido-izq {
                width: 100%;
                padding: 0;
                display: contents;
            }

            .titulo-top {
                order: 1;
                padding: 10px 20px;
                font-size: 1.5rem;
                margin-top: 0;
            }

            .bloque-imagen {
                position: relative;
                width: 100%;
                height: auto;
                right: auto;
                top: auto;
                order: 2;
                display: flex;
                justify-content: center;
                margin: 10px 0;
            }

            .agrupador-imagen {
                width: 150px;
                height: 150px;
                margin-right: 0;
            }

            .imagen-container {
                border-radius: 50% 50% 50% 50% / 60% 40% 60% 40%;
                border-width: 8px;
            }

            .linea-1 {
                width: 156px;
                height: 156px;
                border-radius: 51% 49% 48% 52% / 58% 42% 58% 42%;
                transform: translate(-50%, -50%) rotate(-5deg);
            }
            .linea-2 {
                width: 160px;
                height: 160px;
                border-radius: 48% 52% 52% 48% / 62% 38% 62% 38%;
                transform: translate(-50%, -50%) rotate(5deg);
            }

            .franja-color {
                order: 3;
                width: 100%;
                padding: 20px 10px;
                margin: -50px 0 10px 0;
                padding-top: 60px;
                z-index: 1;
                box-sizing: border-box;
                justify-content: center;
            }

            .franja-color h2 {
                font-size: 1.6rem;
                max-width: 100%;
                text-align: center;
            }

            .logos-area {
                order: 4;
                max-height:35px; 
                padding: 0;
                display: flex;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="banner">
        
        <div class="contenido-izq">
            <h3 class="titulo-top" id="titulo-dinamico">Módulo 1</h3>

            <div class="franja-color">
                <h2 id="subtitulo-dinamico">Introducción al cambio climático</h2>
            </div>

            <div class="logos-area">
                <div id="logos-contenedor" style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                    <img class="logos-img" src="https://www.uninunez.edu.co/images/logotxttealw.svg" alt="Logo Institucional">
                    <span style="font-weight:bold; color: var(--color-primario); font-size: 24px;"></span>
                </div>
            </div>
        </div>

        <div class="bloque-imagen">
            <div class="agrupador-imagen">
                <div class="linea-organica linea-1"></div>
                <div class="linea-organica linea-2"></div>

                <div class="imagen-container">
                    <img class="imagen-banner" id="imagen-dinamica" src="https://images.unsplash.com/photo-1533560904424-a8ae5e7a3cfa?q=80&w=2000&auto=format&fit=crop" alt="Imagen del curso">
                </div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const obtenerParametro = (name) => {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(name);
            }

            const colorParam = obtenerParametro('color');
            const color2Param = obtenerParametro('color2');
            const imagenParam = obtenerParametro('imagen');
            const tituloParam = obtenerParametro('titulo');
            const subtituloParam = obtenerParametro('subtitulo');

            const logos = [
                obtenerParametro('logo1') || obtenerParametro('logo'),
                obtenerParametro('logo2'),
                obtenerParametro('logo3')
            ].filter(Boolean);

            let colorBase = '#249A8C';

            if (colorParam) {
                colorBase = colorParam.startsWith('#') ? colorParam : '#' + colorParam;
                document.documentElement.style.setProperty('--color-primario', colorBase);
                document.documentElement.style.setProperty('--fondo-franja', colorBase);
            }

            if (color2Param) {
                let colorSecundario = color2Param.startsWith('#') ? color2Param : '#' + color2Param;
                document.documentElement.style.setProperty('--fondo-franja', `linear-gradient(90deg, ${colorBase}, ${colorSecundario})`);
            }

            if (imagenParam) {
                const imgElement = document.getElementById('imagen-dinamica');
                if (imgElement) imgElement.src = imagenParam;
            }

            if (logos.length > 0) {
                const container = document.getElementById('logos-contenedor');
                if (container) {
                    container.innerHTML = '';
                    logos.forEach(url => {
                        const img = document.createElement('img');
                        img.src = url;
                        img.className = 'logos-img';
                        img.alt = 'Logo Institucional';
                        container.appendChild(img);
                    });
                }
            }

            if (tituloParam) {
                const tituloElement = document.getElementById('titulo-dinamico');
                if (tituloElement) tituloElement.innerText = tituloParam;
            }

            if (subtituloParam) {
                const subTituloElement = document.getElementById('subtitulo-dinamico');
                if (subTituloElement) subTituloElement.innerText = subtituloParam;
            }
        });
    </script>

</body>
</html>
