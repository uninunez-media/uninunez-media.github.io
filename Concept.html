<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Video con AblePlayer y Señas</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@3/dist/js.cookie.min.js"></script>
  <link rel="stylesheet" href="https://ableplayer.github.io/ableplayer/build/ableplayer.min.css" />
  <link rel="stylesheet" href="estilos.css" />
  <script src="https://ableplayer.github.io/ableplayer/build/ableplayer.min.js"></script>
  <script src="ajustes-ableplayer.js"></script>
</head>

<body>
  <div id="wrapper">
    <div id="player">
      <video id="video1" data-able-player width="800" height="600" preload="auto"
        poster="https://uninunez-media.github.io/Poster.png"
        src="https://uninunez-media.github.io/Concept/Concept.mp4" data-sign-src="https://uninunez-media.github.io/Concept/Concept_Signs.mp4">
        <track kind="captions" src="https://uninunez-media.github.io/Concept/Concept_Captions.vtt" srclang="es"
          label="Español" default>
      </video>
      <!--  -->
    </div>
  </div>
</body>

</html>
