<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="//ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/js-cookie@3.0.1/dist/js.cookie.min.js"></script>

    <link rel="stylesheet" href="https://ableplayer.github.io/ableplayer/build/ableplayer.min.css">
    <script src="https://ableplayer.github.io/ableplayer/build/ableplayer.dist.js"></script>

    <style>
        /* --- 1. CONFIGURACIÓN GLOBAL --- */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #000;
        }

        #wrapper {
            position: relative;
            width: 100%; height: 100vh;
            background-color: #000;
        }

        /* --- 2. VIDEO PRINCIPAL --- */
        #player {
            position: absolute !important;
            left: 0 !important; top: 0 !important;
            width: 70vw !important; /* 80% Desktop */
            height: 100vh !important;
            z-index: 10 !important;
            box-sizing: border-box;
            border-right: 4px solid #333;
            background: #000;
            transition: width 0.3s ease;
        }

        #player.expanded {
            width: 100vw !important;
            border-right: none !important;
        }

        /* Ajustes internos de contenedores */
        #player .able-wrapper, 
        #player .able, 
        #player .able-vidcap-container {
            width: 100% !important; 
            height: 100% !important;
            padding: 0 !important; margin: 0 !important;
            max-width: none !important;
            position: absolute !important; top: 0; left: 0;
        }

        #player .able-media-container {
            width: 100% !important; 
            height: 100% !important;
            position: absolute !important; top: 0; left: 0;
            padding-bottom: 0 !important; 
            overflow: hidden !important;
        }

        #player iframe, #player video {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; 
            height: 100% !important;
            object-fit: cover !important; 
            z-index: 1 !important;
        }

        
        #player .able-player {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            z-index: 100 !important;
            
            /* Magia Flex: Todo al fondo */
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-end !important;
            
            /* Importante: Dejar pasar clics al video en el área vacía */
            pointer-events: none !important; 
        }

       
        #player .able-controller {
            order: 1 !important;
            position: relative !important; /* Ya no absolute, obedece al flex padre */
            width: 100% !important;
            background-color: rgba(0, 0, 0, 0.85) !important;
            display: flex !important;
            flex-direction: column !important;
            padding-top: 5px !important;
            pointer-events: auto !important; /* Reactivar clics */
            bottom: auto !important; top: auto !important; left: auto !important;
        }

     
        #player .able-status-bar {
            order: 2 !important; /* Debajo del controlador */
            position: relative !important;
            width: 100% !important;
            background-color: rgba(0, 0, 0, 0.85) !important; /* Mismo fondo para continuidad */
            color: #ddd !important;
            display: flex !important;
            justify-content: space-between !important;
            padding: 0 15px 5px 15px !important;
            box-sizing: border-box !important;
            pointer-events: auto !important; /* Reactivar clics */
        }

        /* AJUSTES INTERNOS DEL CONTROLADOR */
        #player .able-seekbar-wrapper {
            width: 98% !important; margin: 0 auto !important;
        }
        #player .able-control-row {
            display: flex !important; flex-wrap: wrap !important;
            width: 100% !important;
        }

        /* Tooltips siempre visibles arriba */
        .able-tooltip {
            z-index: 20000 !important;
            bottom: 100% !important; top: auto !important;
        }

 
        #player .able-captions-wrapper {
            position: absolute !important;
            bottom: 100px !important; /* Altura segura */
            left: 0 !important; width: 100% !important;
            z-index: 90 !important;
            pointer-events: none !important;
            background: transparent !important;
            text-align: center !important;
        }
        #player .able-captions {
            background-color: rgba(0, 0, 0, 0.6) !important;
            display: inline-block !important;
            padding: 5px 10px !important;
            border-radius: 4px;
            pointer-events: auto !important;
        }

        /* SEÑAS Y TRANSCRIPCIÓN (PANELES LATERALES) */
        div.able-sign-window {
            position: fixed !important;
            top: 0 !important; right: 0 !important; left: auto !important;
            width: 30vw !important; height: 40vh !important;
            z-index: 9999 !important;
            background: #222 !important;
            border-bottom: 4px solid #333;
        }
        div.able-sign-window iframe { width: 100% !important; height: 100% !important; }

        div.able-transcript-area {
            position: fixed !important;
            bottom: 0 !important; right: 0 !important; top: auto !important; left: auto !important;
            width: 30vw !important; height: 60vh !important;
            z-index: 9999 !important;
            background: #fff !important;
            overflow-y: auto !important;
            border-left: 4px solid #333;
            padding: 15px !important;
            box-sizing: border-box;
        }
        .able-window-toolbar { display: none !important; }

   
        .able-button-handler-sign {
            display: inline-block !important;
            width: auto !important; height: auto !important;
        }

        /* AJUSTES PARA MÓVIL  */
        @media (max-width: 900px) {
            html, body { overflow-y: auto !important; height: auto !important; }
            #wrapper { height: auto !important; position: static !important; display: block !important; }
            
            #player, #player.expanded { 
                position: relative !important; 
                width: 100vw !important; height: auto !important; 
                border: none !important; left: auto !important; top: auto !important;
                padding-bottom: 0 !important; 
            }

            #player .able-wrapper, #player .able {
                display: flex !important; flex-direction: column !important;
                height: auto !important; width: 100% !important;
                position: relative !important;
            }
            
      
            #player .able-player {
                position: relative !important;
                height: auto !important;
                width: 100% !important;
                justify-content: flex-start !important;
                pointer-events: auto !important;
                order: 2 !important; /* Debajo del video */
            }

            #player .able-vidcap-container { 
                order: 1 !important; position: relative !important; 
                height: auto !important; width: 100% !important;
            }
            #player .able-media-container { 
                aspect-ratio: 16/9 !important; height: auto !important; 
                padding-bottom: 0 !important; position: relative !important;
            }
            #player iframe, #player video {
                position: relative !important; object-fit: contain !important; height: 100% !important;
            }

            /* Subtítulos Móvil */
            #player .able-captions-wrapper {
                position: absolute !important; bottom: 10px !important;
            }

            /* Paneles Laterales Móvil */
            div.able-sign-window {
                order: 3 !important; position: relative !important;
                width: 100vw !important; aspect-ratio: 16 / 9 !important;
                height: auto !important; max-height: 60vw !important;
                top: auto !important; right: auto !important; left: auto !important;
                border: none !important; border-top: 2px solid #333 !important;
                z-index: 1 !important; background: #000 !important;
            }
            div.able-sign-window iframe { position: absolute !important; height: 100% !important; }

            div.able-transcript-area {
                order: 4 !important; position: relative !important;
                width: 100vw !important; height: 400px !important;
                top: auto !important; bottom: auto !important;
                border-top: 2px solid #333 !important; z-index: 1 !important;
            }
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <div id="player">
            {{ content }}
        </div>
    </div>

    <script>
        function checkLayout() {
            var signWindow = document.querySelector('.able-sign-window');
            var transcriptWindow = document.querySelector('.able-transcript-area');
            var player = document.getElementById('player');

            var signHidden = !signWindow || window.getComputedStyle(signWindow).display === 'none';
            var transHidden = !transcriptWindow || window.getComputedStyle(transcriptWindow).display === 'none';

            if (signHidden && transHidden) {
                player.classList.add('expanded');
            } else {
                player.classList.remove('expanded');
            }
        }
        setInterval(checkLayout, 200);
        window.addEventListener('load', checkLayout);
    </script>
</body>
</html>
