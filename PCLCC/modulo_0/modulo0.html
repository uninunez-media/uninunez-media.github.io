<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video with synchronized sign language sourced from YouTube | Able Player Demos</title>

<!-- Dependencies -->
<script src="//ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="//cdn.jsdelivr.net/npm/js-cookie@3.0.1/dist/js.cookie.min.js"></script>

<!-- Able Player CSS -->
<link rel="stylesheet" href="https://ableplayer.github.io/ableplayer/build/ableplayer.min.css" type="text/css"/>

<!-- Able Player JavaScript -->
<script src="https://ableplayer.github.io/ableplayer/build/ableplayer.dist.js"></script>

<!-- CSS for this example -->
<style>
	#video-wrapper {
		width: 500px;
	}
</style>
</head>

<body>
	<main>
		<h1>Video with sign language sourced from YouTube</h1>

		<p>An accompanying sign language video is provided using the
			<code>data-youtube-sign-src</code> attribute. This results in a sign language video being played in a pop-up window
			in sync with the program video. Unfortunately, this does not work in iOS.
		</p>

		<div id="video-wrapper">
			<video id="video1" preload="auto" poster="" data-icon-type="image" data-able-player playsinline>
				<source type="video/mp4" src="https://uninunez-media.github.io/Recursos/Recursos.mp4" data-youtube-sign-src="bf6214F7srY"/>
				<track kind="captions" src="https://uninunez-media.github.io/Recursos/Recursos_Captions.vtt" srclang="de" label="Deutsche"/>
				
			</video>
		</div>

	</main>
</body>
</html>
