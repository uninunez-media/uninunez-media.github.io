<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">

<script src="//ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="//cdn.jsdelivr.net/npm/js-cookie@3.0.1/dist/js.cookie.min.js"></script>

<link rel="stylesheet" href="https://ableplayer.github.io/ableplayer/build/ableplayer.min.css" />
<script src="https://ableplayer.github.io/ableplayer/build/ableplayer.dist.js"></script>
<style >

 html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  background: #fff;
}
body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}


div#wrapper {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  width: 1230px;
  max-width: 100%;
  background: #fff;
  margin-top: 2rem;
  justify-content: flex-start; /* por defecto a la izquierda */
}
#wrapper.center-player {
  justify-content: center !important;
}
#player {
  position: relative;
  width: 100%;
  transition: width 0.2s;
}

#player .able-sign-window {
  position: absolute !important;
  left: calc(100% + 10px) !important;
  top: 0px !important;
  width: 30% !important;
  z-index: 10000 !important;
  margin: 0 !important;
}

#player .able-transcript-area {
  position: absolute !important;
  left: calc(100% + 10px) !important;
  top: 45% !important;
  width: 30% !important;
  z-index: 10000 !important;
  margin: 0 !important;
  transition: top 0.2s;
}

#player .able-wrapper .able  :has(.able-sign-window) {
  width: 50%;
  height: 100%;
}
@media (max-width: 900px) {
  #player {
    width: 100% !important;
  }
  #player .able-sign-window,
  #player .able-transcript-area {
    position: static !important;
    left: unset !important;
    top: unset !important;
    width: 100% !important;
    margin-top: 10px !important;
  }
}
#transcript {
  width: 100%;
  }
#signs {
  width: 100%;
  }
#transcript div.able-desc,
#signs div.able-desc {
  width: 100%;
}
</style>
</head>
<body>
  <div id="wrapper">
    <div id="player">
<video id="video1" preload="auto" data-able-player data-youtube-nocookie="true" data-youtube-id="RTUGD4_Zlro"  data-youtube-sign-src="v9KBV2ULxGc" data-transcript-div="transcript" data-show-transcript="true" playsinline>
  <track kind="subtitles" src="captions_presentacion.vtt" srclang="es" label="Español"/>
  <track kind="subtitles" src="captions_presentacion_en.vtt" srclang="en" label="English"/>
  <track kind="chapters" src="chapters_presentacion.vtt" srclang="es"/>
  <track kind="chapters" src="chapters_presentacion_en.vtt" srclang="en"/>
</video>
  </div>

  </div>

</body>
</html>
