<!DOCTYPE html>
<html lang="es">
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="//ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/js-cookie@3.0.1/dist/js.cookie.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/uninunez-media/ableplayer@main/build/ableplayer.min.css" />
    <script src="https://cdn.jsdelivr.net/gh/uninunez-media/ableplayer@main/build/ableplayer.dist.js"></script>
    
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background: #fff;
      }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      
      div#wrapper {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        width: 1280px;
        max-width: 98%;
        background: #fff;
        margin-top: 2rem;
        justify-content: flex-start; /* por defecto a la izquierda */
        	gap: 20px;
      }
      
     /* #player {
        
        width: 70%;
        transition: width 0.2s;
      }
      
      #transcript {
      		width: 30%;
      	}*/
      div#columns {
    		display: grid;
    		grid-template-columns: 70% 1fr;
    		gap: 10px;
    		max-width: 1120px;
    	}
    	div#col2 {
    		/*background-color: #e8ddf0;
    		border: 1px solid #340449;*/
    		margin-right: 1em;
    	}
    	div#col1 div.able-wrapper {
    		margin-top: 0;
    	}
      
      /* ------------------------------------------- */
      
      #player .able-media-container {
        position: relative;
        /* padding-bottom para mantener el aspect-ratio 16:9 */
        padding-bottom: 56.25% !important; 
        height: 0 !important;
        overflow: hidden;
      }
      
      #player .able-media-container iframe {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
      }
     #transcript .able-transcript-caption {    
        /*display: block;*/                         
        margin-bottom: 0.3em;
        white-space: pre-line;                   
      }

      #col2 {
         align-self: stretch;
      }
            @media (max-width: 900px) {
        div#columns {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto;
          gap: 20px;
        }
      }
    </style>
  
  </head>
  <body>
    <main>
      <div id="columns">
        <div class="column" id="col1">
          <section id="player" aria-label="Video player">
            <video id="video1" preload="auto" data-able-player data-youtube-nocookie="true" data-youtube-id="RTUGD4_Zlro" data-transcript-div="transcript"  playsinline>
              <track kind="captions" src="captions_presentacion.vtt" srclang="es" label="Español" default />
              <track kind="captions" src="captions_presentacion_en.vtt" srclang="en" label="English"/>
              <track kind="chapters" src="chapters_presentacion.vtt" srclang="es"/>
              <track kind="chapters" src="chapters_presentacion_en.vtt" srclang="en"/>
            </video>
          </section>
        </div>
        <div class="column" id="col2">
          <section id="transcript-wrapper" aria-label="Transcript">
            <div id="transcript"></div>
          </section>
        </div>
       
      </div>
    </main>
  </body>
</html>
